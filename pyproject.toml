[project]
name = "ai-response-streamer"
version = "0.1.0"
description = "Streams AI responses back through a web socket connection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "websockets",
    "aiohttp",
]

[project.optional-dependencies]
# Local embedding support (chunking + vector search + sentence embeddings).
# torch is unpinned so uv resolves the latest available version for the current
# platform. Intel macOS is not supported because torch no longer publishes
# wheels for that platform; use Apple Silicon macOS, Linux, or Windows instead.
embedding = [
    "faiss-cpu",
    "numpy",
    "sentence-transformers",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
