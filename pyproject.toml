[project]
name = "ai-response-streamer"
version = "0.1.0"
description = "Streams AI responses back through a web socket connection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "websockets",
    "aiohttp",
]

[project.optional-dependencies]
# Local embedding support (chunking + vector search + sentence embeddings).
# torch dropped Intel macOS wheels after 2.2.2 (Python 3.11 was the last cpython
# it shipped for on that platform), so it's capped there for that platform/python.
# On Intel macOS, use a separate venv pinned to Python 3.11 for this extra:
#   uv sync --extra embedding --python 3.11
embedding = [
    "faiss-cpu",
    "numpy",
    "sentence-transformers",
    "torch<2.3 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
